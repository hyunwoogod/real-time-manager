<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 집감독 실시간 야구 매니지먼트</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">⚾</div>
        <h1 class="auth-title">집감독</h1>
        <p class="auth-subtitle">실시간 라이브 야구 감독 매니지먼트</p>
        <div class="auth-card-header">로그인</div>
        {% if error %}
        <div class="error-alert">
            ⚠️ {{ error }}
        </div>
        {% endif %}
        {% if notice %}
        <div class="notice-alert">
            ✅ {{ notice }}
        </div>
        {% endif %}
        <form method="POST" action="/login" class="auth-form">
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="가입한 이메일을 입력하세요" value="{{ email or '' }}" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">비밀번호 (Password)</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="btn-submit-login">로그인</button>
        </form>
        <div class="help-links">
            <a href="/find-email" id="link-find-email">이메일 찾기</a>
            <span>|</span>
            <a href="/forgot-password" id="link-forgot-password">비밀번호를 잊으셨나요?</a>
        </div>

        {% set divider_text = '또는 간편 로그인' %}
        {% include '_social_buttons.html' %}

        <div class="auth-links">
            <div>
                아직 계정이 없으신가요? <a href="/signup" id="link-to-signup">이메일로 회원가입하기</a>
            </div>
            <div>
                <a href="/" class="auth-back">← 메인 화면으로 돌아가기</a>
            </div>
        </div>
    </div>
</body>
</html>
