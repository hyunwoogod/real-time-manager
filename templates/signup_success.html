<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 완료 - 집감독 실시간 야구 매니지먼트</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #070d19;
            background-image: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans KR', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .success-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(20px);
            text-align: center;
            animation: fadeInCard 0.4s ease-out;
        }
        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon-badge {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.4));
            border: 2px solid #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
        }
        .success-title {
            font-size: 1.65rem;
            font-weight: 900;
            margin: 0 0 12px 0;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .success-desc {
            font-size: 0.96rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0 0 28px 0;
        }
        .team-highlight-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 8px;
        }
        .btn-go-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-go-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.6);
        }
        .auto-redirect-timer {
            font-size: 0.82rem;
            color: #64748b;
            margin-top: 18px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon-badge">🎉</div>
        
        <!-- 회원가입 완료 핵심 문구 -->
        <h1 class="success-title">회원가입되었습니다!</h1>
        
        <div class="success-desc">
            <strong>{{ username }}</strong> 감독님, 환영합니다!<br>
            선택하신 KBO 응원 구단으로 등록이 완료되었습니다.
            <div>
                <span class="team-highlight-pill">⚾ 응원 구단: {{ favorite_team }}</span>
            </div>
        </div>

        <!-- 로그인 화면으로 가기 버튼 -->
        <a href="/login" class="btn-go-login" id="btn-go-to-login">
            로그인 화면으로 가기 ➔
        </a>

        <p class="auto-redirect-timer">
            <span id="countdown">3</span>초 후 자동으로 로그인 화면으로 이동합니다.
        </p>
    </div>

    <script>
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '/login';
            }
        }, 1000);
    </script>
</body>
</html>
